name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using ssh
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /root/proyecto-dev
            git fetch
            git checkout ${{ secrets.DEV_BRANCH }}
            git pull origin dev
            
            # Escribir archivo .env
            echo "${{ secrets.ENV_DEV }}" > .env
            
            # Reconstruir contenedor en puerto 8083
            docker compose down || true
            PORT=8083 docker compose up -d --build
            exit